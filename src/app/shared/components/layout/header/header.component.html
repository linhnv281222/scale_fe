<header
  class="sticky top-0 z-50 bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700"
>
  <!-- Top bar with menu and user actions -->
  <div class="px-3 !py-2 flex items-center justify-between">
    <!-- Left side - Logo and Menu -->
    <div class="flex items-center flex-1 gap-3 overflow-x-auto">
      <!-- System Logo -->
      <img
        [src]="systemLogo"
        alt="System Logo"
        class="flex-shrink-0 object-contain h-8"
      />
      <nav class="flex items-center gap-1 whitespace-nowrap">
        <ng-container *ngIf="menuItems && menuItems.length > 0">
          <ng-container *ngFor="let item of menuItems; let i = index">
            <!-- Menu item without children -->
            <a
              *ngIf="!item.children || item.children.length === 0"
              [routerLink]="item.path"
              routerLinkActive="bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-400 font-semibold"
              class="px-3 py-1.5 rounded text-sm font-medium text-gray-700 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors block whitespace-nowrap"
              [routerLinkActiveOptions]="{ exact: false }"
            >
              {{ item.label | translate }}
            </a>

            <!-- Menu item with children -->
            <ng-container *ngIf="item.children && item.children.length > 0">
              <div
                nz-dropdown
                [nzDropdownMenu]="submenu"
                nzTrigger="hover"
                nzPlacement="bottomLeft"
                class="relative dropdown-menu-item"
              >
                <div
                  [ngClass]="{
                    'bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-400 font-semibold': isMenuItemActive(item),
                    'text-gray-700 dark:text-white': !isMenuItemActive(item)
                  }"
                  class="px-3 py-1.5 rounded text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer flex items-center gap-1 whitespace-nowrap"
                >
                  <span class="flex-1">{{ item.label | translate }}</span>
                  <span
                    nz-icon
                    nzType="down"
                    nzTheme="outline"
                    class="text-xs"
                  ></span>
                </div>
              </div>

              <!-- Submenu template -->
              <nz-dropdown-menu
                #submenu="nzDropdownMenu"
                class="dropdown-submenu"
              >
                <ul
                  nz-menu
                  nzSelectable
                  class="bg-white min-w-48 dark:bg-gray-800"
                >
                  <li
                    nz-menu-item
                    *ngFor="let child of item.children"
                    class="p-0 text-gray-900 dark:text-gray-100"
                  >
                    <a 
                      [routerLink]="child.path" 
                      routerLinkActive="bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-400 font-semibold"
                      class="block w-full px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                      [routerLinkActiveOptions]="{ exact: false }"
                    >
                      {{ child.label | translate }}
                    </a>
                  </li>
                </ul>
              </nz-dropdown-menu>
            </ng-container>
          </ng-container>
        </ng-container>
      </nav>
    </div>

    <!-- Right side - User Actions -->
    <div class="flex items-center flex-shrink-0 gap-2">
      <!-- Language Selector -->
      <div
        nz-dropdown
        [nzDropdownMenu]="languageMenu"
        nzTrigger="click"
        nzPlacement="bottomRight"
      >
        <div
          class="flex items-center gap-1.5 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded px-2 transition-colors py-1"
          [nzTooltipTitle]="'common.language' | translate"
          nz-tooltip
        >
          <img
            [src]="getCurrentLanguageFlag()"
            [alt]="currentLang"
            class="object-cover w-5 h-5 rounded-sm"
          />
        </div>
      </div>
      <nz-dropdown-menu #languageMenu="nzDropdownMenu">
        <ul nz-menu nzSelectable class="bg-white min-w-48 dark:bg-gray-800">
          <li
            *ngFor="let lang of languages"
            nz-menu-item
            (click)="onLanguageChange(lang.code)"
            [ngClass]="{
              'bg-blue-50 dark:bg-blue-900/30': currentLang === lang.code,
              'p-0 text-gray-900 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700': true
            }"
          >
            <a class="flex items-center w-full gap-2 px-4 py-2">
              <img
                [src]="lang.flag"
                [alt]="lang.code"
                class="object-cover w-5 h-5 rounded-sm"
              />
              <span>{{ lang.label }}</span>
            </a>
          </li>
        </ul>
      </nz-dropdown-menu>

      <!-- Theme Toggle -->
      <button
        (click)="onToggleTheme()"
        class="px-2 py-1 text-gray-600 transition-colors rounded hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-gray-300"
        [nzTooltipTitle]="
          (isDarkMode ? 'common.lightMode' : 'common.darkMode') | translate
        "
        nz-tooltip
      >
        <span
          *ngIf="!isDarkMode"
          nz-icon
          nzType="moon"
          nzTheme="outline"
          class="text-base"
        ></span>
        <span
          *ngIf="isDarkMode"
          nz-icon
          nzType="sun"
          nzTheme="outline"
          class="text-base"
        ></span>
      </button>

      <!-- Notifications -->
      <button
        class="relative px-2 py-1 text-gray-600 transition-colors rounded hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-gray-300"
        [nzTooltipTitle]="'common.notifications' | translate"
        nz-tooltip
      >
        <span nz-icon nzType="bell" nzTheme="outline" class="text-base"></span>
        <nz-badge
          [nzCount]="0"
          [nzShowZero]="false"
          class="absolute -top-0.5 -right-0.5"
        ></nz-badge>
      </button>

      <!-- User Menu -->
      <div nz-dropdown [nzDropdownMenu]="userMenu" nzTrigger="click">
        <div
          class="flex items-center gap-1.5 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded px-2 transition-colors py-1"
        >
          <nz-avatar
            nzSize="small"
            nzIcon="user"
            class="bg-blue-600"
          ></nz-avatar>
          <div class="hidden text-left md:block">
            <div class="text-xs font-medium text-gray-700 dark:text-gray-300">
              {{ currentUser?.name || "User" }}
            </div>
          </div>
          <span
            nz-icon
            nzType="down"
            nzTheme="outline"
            class="text-xs text-gray-500 dark:text-gray-400"
          ></span>
        </div>
      </div>
      <nz-dropdown-menu #userMenu="nzDropdownMenu">
        <ul nz-menu nzSelectable class="bg-white min-w-48 dark:bg-gray-800">
          <li
            nz-menu-
            (click)="logout()"
            class="p-0 text-gray-900 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700"
          >
            <a class="block w-full px-4 py-2">
              {{ "common.logout" | translate }}
            </a>
          </li>
        </ul>
      </nz-dropdown-menu>
    </div>
  </div>
</header>
