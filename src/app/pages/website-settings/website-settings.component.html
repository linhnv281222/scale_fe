<div class="flex flex-col h-full bg-gray-50 dark:bg-gray-900">
  <main class="flex flex-col flex-1 overflow-hidden">
    <div class="flex-1 overflow-auto">
      <div class="max-w-4xl p-4 mx-auto">
        <div class="p-4 bg-white rounded-lg shadow-sm dark:bg-gray-800">
          <div class="space-y-4">
            <div>
              <h3
                class="mb-3 text-base font-semibold text-gray-900 dark:text-gray-100"
              >
                {{ "systemConfig.title" | translate }}
              </h3>
              <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.companyName" | translate
                    }}<span class="ml-1 text-red-500">*</span>
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.companyName"
                      [placeholder]="'systemConfig.companyNamePlaceholder' | translate"
                      class="w-full"
                      required
                    />
                  </nz-input-group>
                  <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
                    {{ "systemConfig.companyNameNote" | translate }}
                  </p>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.companyNameEn" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.companyNameEn"
                      [placeholder]="'systemConfig.companyNameEnPlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.address" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.address"
                      [placeholder]="'systemConfig.addressPlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "scales.phone" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.phone"
                      [placeholder]="'systemConfig.phonePlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "scales.email" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="email"
                      nz-input
                      [(ngModel)]="settings.email"
                      [placeholder]="'systemConfig.emailPlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "scales.website" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="url"
                      nz-input
                      [(ngModel)]="settings.website"
                      [placeholder]="'systemConfig.websitePlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.taxCode" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.taxCode"
                      [placeholder]="'systemConfig.taxCodePlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>

                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.watermarkText" | translate }}
                  </label>
                  <nz-input-group>
                    <input
                      type="text"
                      nz-input
                      [(ngModel)]="settings.watermarkText"
                      [placeholder]="'systemConfig.watermarkTextPlaceholder' | translate"
                      class="w-full"
                    />
                  </nz-input-group>
                </div>
              </div>
            </div>

            <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
              <h3
                class="mb-3 text-base font-semibold text-gray-900 dark:text-gray-100"
              >
                {{ "systemConfig.logoAndImages" | translate }}
              </h3>
              <div class="space-y-4">
                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.logo" | translate }}
                  </label>
                  <p class="mb-2 text-xs text-gray-500 dark:text-gray-400">
                    {{ "systemConfig.logoDescription" | translate }}
                  </p>
                  <app-upload-file
                    [files]="logoFiles"
                    [filesFromBE]="logoFilesFromBE"
                    [maxFiles]="1"
                    [maxFileSizeMB]="10"
                    [allowUpload]="true"
                    [allowedFileTypes]="['png', 'jpg', 'jpeg', 'svg']"
                    [required]="false"
                    [showTime]="false"
                    (outputListFile)="onLogoFilesChanged($event)"
                    (outputListFileFromBE)="onLogoFilesFromBEChanged($event)"
                  ></app-upload-file>
                </div>
                <div>
                  <label
                    class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300"
                  >
                    {{ "systemConfig.favicon" | translate }}
                  </label>
                  <p class="mb-2 text-xs text-gray-500 dark:text-gray-400">
                    {{ "systemConfig.faviconDescription" | translate }}
                  </p>
                  <app-upload-file
                    [files]="faviconFiles"
                    [filesFromBE]="faviconFilesFromBE"
                    [maxFiles]="1"
                    [maxFileSizeMB]="2"
                    [allowUpload]="true"
                    [allowedFileTypes]="['png', 'jpg', 'jpeg', 'ico', 'svg']"
                    [required]="false"
                    [showTime]="false"
                    (outputListFile)="onFaviconFilesChanged($event)"
                    (outputListFileFromBE)="onFaviconFilesFromBEChanged($event)"
                  ></app-upload-file>
                </div>
              </div>
            </div>

            <div
              class="sticky bottom-0 flex justify-end gap-3 pt-4 mt-4 bg-white border-t border-gray-200 dark:bg-gray-800 dark:border-gray-700"
            >
              <button
                nz-button
                nzType="default"
                (click)="loadSettings()"
                [disabled]="saving"
              >
                {{ "common.cancel" | translate }}
              </button>
              <button
                nz-button
                nzType="primary"
                (click)="saveSettings()"
                [nzLoading]="saving"
              >
                {{ "common.save" | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
