<div class="relative flex flex-col min-h-screen overflow-hidden bg-gradient-to-br from-blue-50 via-blue-100 to-indigo-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">
  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-20 dark:opacity-10">
    <div class="absolute inset-0" style="background-image: radial-gradient(circle, #3b82f6 1px, transparent 1px); background-size: 30px 30px;"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 flex items-center justify-between px-6 py-4">
    <div class="flex items-center gap-3">
      <img
        [src]="headerLogo"
        [alt]="systemName"
        class="h-8 object-contain"
      />
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">{{ systemName }}</h1>
    </div>
    <button
      (click)="toggleTheme()"
      class="p-2 transition-colors rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <span
        nz-icon
        [nzType]="isDarkMode ? 'sun' : 'moon'"
        nzTheme="outline"
        class="text-xl text-gray-700 dark:text-gray-300"
      ></span>
    </button>
  </header>

  <!-- Login Card -->
  <div class="relative z-10 flex items-center justify-center flex-1 px-4 py-8">
    <div class="w-full max-w-md">
      <div class="p-8 bg-white border border-gray-200 shadow-2xl dark:bg-gray-800 rounded-2xl dark:border-gray-700">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
          <img
            [src]="loginLogo"
            [alt]="loginSystemName"
            class="h-16 object-contain"
          />
        </div>

        <!-- Title -->
        <h2 class="mb-2 text-3xl font-bold text-center text-gray-900 dark:text-white">
          {{ 'login.title' | translate }}
        </h2>

        <!-- Welcome Message -->
        <p class="mb-8 text-center text-gray-600 dark:text-gray-400">
          {{ 'login.welcomeMessage' | translate }}
        </p>

        <!-- Login Form -->
        <div class="space-y-6">
          <!-- Username -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
              {{ 'login.username' | translate }}
            </label>
            <nz-input-group [nzPrefix]="prefixUser" class="w-full">
              <input
                type="text"
                nz-input
                [(ngModel)]="username"
                [placeholder]="'login.usernamePlaceholder' | translate"
                class="w-full"
                [class.border-red-500]="usernameError"
              />
            </nz-input-group>
            <ng-template #prefixUser>
              <span nz-icon nzType="user" nzTheme="outline" class="text-gray-400"></span>
            </ng-template>
            <div
              *ngIf="usernameError"
              class="mt-1 text-sm text-red-600 dark:text-red-400"
            >
              {{ usernameError }}
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
              {{ 'login.password' | translate }}
            </label>
            <nz-input-group [nzPrefix]="prefixLock" [nzSuffix]="suffixEye" class="w-full">
              <input
                [type]="showPassword ? 'text' : 'password'"
                nz-input
                [(ngModel)]="password"
                [placeholder]="'login.passwordPlaceholder' | translate"
                class="w-full"
                [class.border-red-500]="passwordError"
              />
            </nz-input-group>
            <ng-template #prefixLock>
              <span nz-icon nzType="lock" nzTheme="outline" class="text-gray-400"></span>
            </ng-template>
            <ng-template #suffixEye>
              <span
                nz-icon
                [nzType]="showPassword ? 'eye-invisible' : 'eye'"
                nzTheme="outline"
                class="text-gray-400 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300"
                (click)="togglePassword()"
              ></span>
            </ng-template>
            <div
              *ngIf="passwordError"
              class="mt-1 text-sm text-red-600 dark:text-red-400"
            >
              {{ passwordError }}
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <label nz-checkbox [(ngModel)]="rememberMe" class="text-sm text-gray-700 dark:text-gray-300">
              {{ 'login.rememberMe' | translate }}
            </label>
            <a
              href="#"
              class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
            >
              {{ 'login.forgotPassword' | translate }}
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="button"
            (click)="onSubmit()"
            [disabled]="loading"
            class="flex items-center justify-center w-full gap-2 px-4 py-3 font-semibold text-white transition-colors bg-blue-600 rounded-lg hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="loading" nz-icon nzType="loading" nzTheme="outline" class="animate-spin"></span>
            <span *ngIf="!loading">{{ 'login.loginButton' | translate }}</span>
            <span *ngIf="!loading" nz-icon nzType="right" nzTheme="outline"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
